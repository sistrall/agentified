name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Cheap gate: no containers built beyond the tiny test runner, no network.
  # Everything that can fail here fails in seconds rather than in a ten-minute
  # image build.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make lint
      - run: make unit

  # One job per scenario so a failure names the configuration that broke, and
  # so the slow agent-installing scenarios do not block the policy ones.
  scenario:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - boundary_only
          - learn_mode
          - off_mode
          - dns_blocked_and_cidrs
          - root_remote_user
          - ubuntu_base
          - claude_defaults
          - claude_and_pi
          # Runs real package managers behind the boundary. Here to catch *our*
          # regressions; the scheduled profile-drift workflow runs the same
          # scenario to catch upstream registries moving.
          - toolchains
    steps:
      - uses: actions/checkout@v4
      - name: ${{ matrix.scenario }}
        run: make test-one SCENARIO=${{ matrix.scenario }}

  autogenerated:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-feature
