name: profile drift

# Allowlists go stale because *other people* ship changes — a registry adds a
# CDN host, a tool moves its auth endpoint. Nothing in our repository changes
# when that happens, so a test that only runs on pull requests would not notice
# until somebody happened to open one, and the first report would come from a
# user with a broken container.
#
# So the same scenario runs here on a schedule, and opens an issue when it
# fails. (It also runs on pull requests, where it catches the other failure
# mode: a change of ours breaking a toolchain.)
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, early
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  toolchains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs real package managers behind the boundary and fails if the policy
      # had to refuse anything. The failure output names the missing hosts.
      - id: run
        run: make test-one SCENARIO=toolchains

      - if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Profile drift: a toolchain was refused a host'
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'profile-drift',
            })
            if (existing.data.length) return
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ['profile-drift'],
              body: [
                'The scheduled toolchain check failed, which means a real package',
                'manager asked for a host the shipped profiles do not allow.',
                '',
                `Run log: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'The failing step prints the exact hostnames. For each one, either',
                'add it to the matching file in `src/agentified/files/profiles/`',
                'and refresh that file\'s `# verified:` date, or record in the file',
                'why it should stay blocked.',
              ].join('\n'),
            })
